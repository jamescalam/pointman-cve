name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1

jobs:
  plan:
    # CI on main is redundant in the security repository.
    if: ${{ github.repository != 'astral-sh/uv-security' || github.ref != 'refs/heads/main' }}
    uses: $/.github/workflows/plan.yml

  check-fmt:
    needs: plan
    uses: $/.github/workflows/check-fmt.yml

  review:
    needs: plan
    if: ${{ github.event_name == 'pull_request' && github.repository == 'astral-sh/uv' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.review-security == 'true' }}
    uses: astral-sh/github-actions/.github/workflows/pull-request-security-review.yml@f11dbff15181b71f2cc5e8487b1ac7d7bb03ea7d
    with:
      runner: depot-ubuntu-24.04-16
      helper-runner: github-ubuntu-24.04-x86_64-4
      # renovate: datasource=github-release-attachments depName=astral-sh/uv
      uv-version: "0.13.5"
      uv-checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      # Install Rust tools such as cargo-nextest so the reviewer can test PR code.
      # Keep the environment outside the checkout when switching to the PR head.
      setup-command: |
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/pull-request-review-tools"
        export UV_PYTHON_DOWNLOADS_JSON_URL="$GITHUB_WORKSPACE/crates/uv-python-managed/download-metadata.json"
        uv sync --locked --only-dev
        echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read

  review-code-quality:
    needs: plan
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (github.repository == 'astral-sh/uv' || github.repository == 'astral-sh/uv-dev') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.plan.outputs.run-checks == 'true'
      }}
    uses: $/.github/workflows/pull-request-code-quality-review.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read

  check-lint:
    needs: plan
    uses: $/.github/workflows/check-lint.yml
    with:
      code-changed: ${{ needs.plan.outputs.test-code }}
      save-rust-cache: ${{ needs.plan.outputs.save-rust-cache }}

  check-docs:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' }}
    uses: $/.github/workflows/check-docs.yml
    secrets: inherit

  check-zizmor:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' }}
    uses: $/.github/workflows/check-zizmor.yml
    permissions:
      contents: read
      security-events: write

  check-publish:
    needs: plan
    if: ${{ needs.plan.outputs.test-code == 'true' }}
    uses: $/.github/workflows/check-publish.yml

  check-release:
    needs: plan
    if: ${{ needs.plan.outputs.run-checks == 'true' || needs.plan.outputs.require-check-release == 'true' }}
    uses: $/.github/workflows/check-release.yml

  check-crates-policies:
    needs: plan
    if: ${{ needs.plan.outputs.check-crates-policies == 'true' }}
    uses: $/.github/workflows/check-crates-policies.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  check-cargo-lock-changes:
    name: "Cargo lockfile changes"
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.repository_owner == 'astral-sh' &&
        github.event.pull_request.head.repo.full_name != github.repository
      }}
    runs-on: github-ubuntu-24.04-x86_64-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
      - name: "Check Cargo lockfile changes"
