# A CVE tracker: recent advisories, which ones hit the versions your projects' lockfiles pin (read from git at a
# ref, on command), and your own record of each one that touched a project, kept as this extension's files in the
# workspace.

[extension]
id = "cve"
name = "CVE tracker"
version = "0.6.0"
publisher = "jamescalam"
summary = "Recent advisories, the ones that hit your lockfiles, and a shared record of each that touched a project."
node = ">=0.2.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["python", "-m", "pointman_cve"]
runtime = "python3.12"

[permissions]
network = true                   # GitHub's advisory database, OSV.dev, CISA's KEV feed and FIRST's EPSS
folders = ["~/Documents"]         # lockfiles only, for /cve scan and /cve check: where projects live

[settings]
type = "object"

[settings.properties.projects]
type = "array"
title = "Projects"
description = "What /cve scan reads: each a project's key (MB), its git repo under ~/Documents, and the ref whose lockfiles count (origin/main if left out). A folder that isn't a git repo is read as files."
default = []
items = { type = "object", required = ["key", "repo"], additionalProperties = false, properties = { key = { type = "string", title = "Project", description = "A project's key: MB.", pattern = "^[A-Za-z][A-Za-z0-9]{0,15}$" }, repo = { type = "string", title = "Repo", description = "Its folder: ~/Documents/message-board." }, ref = { type = "string", title = "Ref", description = "A branch, tag or commit, fetched first.", default = "origin/main" } } }

[settings.properties.ecosystem]
type = "string"
title = "Ecosystem"
description = "What /cve recent shows by default: all, rust, pip, go, npm, rubygems, maven, nuget, composer, swift or actions."
default = "all"

[[commands]]
kind = "cve.recent"
title = "Recent advisories"
params = { type = "object", properties = { ecosystem = { type = "string", description = "all, rust, pip, go, npm, …; left out, the setting." }, days = { type = "integer", minimum = 1, maximum = 90, description = "How far back; 7 if left out." } } }
slash = "recent"
summary = "Advisories published lately, newest first: /cve recent rust 14"

[[commands]]
kind = "cve.scan"
title = "Scan projects at their git refs for advisories"
lane = "scan"
params = { type = "object", properties = { project = { type = "string", description = "A project's key in the projects setting; left out, every one." } } }
slash = "scan"
summary = "Scan the projects setting's repos at their refs: what's new, reopened, gone and open: /cve scan MB"

[[commands]]
kind = "cve.plan"
title = "Upgrade plan: which upgrades fix a project's advisories"
params = { type = "object", required = ["project"], properties = { project = { type = "string", description = "A project's key in the projects setting: MB." } } }
slash = "plan"
summary = "The fewest upgrades that fix the most: a line a package, from, to and how many it fixes: /cve plan MB"

[[commands]]
kind = "cve.check"
title = "Check one folder's lockfiles against advisories"
params = { type = "object", properties = { folder = { type = "string", description = "The folder, read as it is on disk." }, project = { type = "string", description = "A project's key: opens an impact there for each advisory found." } } }
slash = "check"
summary = "Which advisories hit the versions a folder's lockfiles pin: /cve check ~/Documents/app MB"

[[commands]]
kind = "cve.add"
title = "Record an advisory that touched a project"
params = { type = "object", required = ["advisory", "project"], properties = { advisory = { type = "string", description = "CVE-…, GHSA-…, or a short name for one without an id; several that one fix covers, comma-separated." }, project = { type = "string", description = "The project's key: MB." }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"] }, fixed_in = { type = "string", description = "The release or version that fixed it." }, note = { type = "string" }, justification = { type = "string", enum = ["not_present", "not_reachable", "not_in_execute_path", "inline_mitigations", "protected"], description = "Why it's not_affected." }, severity = { type = "string", enum = ["critical", "high", "medium", "low", "unknown"], description = "Ours, beside the published one." }, title = { type = "string" }, package = { type = "string", description = "Where it hit: the package." }, version = { type = "string" }, fixed_version = { type = "string" }, file = { type = "string", description = "The lockfile." }, repo = { type = "string", description = "owner/repo." }, pr = { type = "string", description = "PR or commit links, comma-separated." }, thread = { type = "string", description = "Pointman threads, comma-separated." }, task = { type = "string", description = "Task refs, comma-separated: MB-588." }, by = { type = "string", description = "Who found it." } } }
slash = "add"
summary = "Record an advisory that touched a project: /cve add CVE-2026-1234 MB"

[[commands]]
kind = "cve.set"
title = "Update a recorded impact"
params = { type = "object", required = ["advisory", "project"], properties = { advisory = { type = "string", description = "One, or several comma-separated." }, project = { type = "string" }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"] }, pr = { type = "string", description = "PR or commit links to add, comma-separated." }, thread = { type = "string", description = "Threads to add." }, task = { type = "string", description = "Task refs to add." }, fixed_in = { type = "string", description = "The release or version that fixed it." }, note = { type = "string" }, justification = { type = "string", enum = ["not_present", "not_reachable", "not_in_execute_path", "inline_mitigations", "protected"] }, severity = { type = "string", enum = ["critical", "high", "medium", "low", "unknown"] }, title = { type = "string" }, package = { type = "string" }, version = { type = "string" }, fixed_version = { type = "string" }, file = { type = "string" }, repo = { type = "string" } } }
slash = "set"
summary = "Update an impact: /cve set CVE-2026-1234 MB fixed pr=https://github.com/…"

[[commands]]
kind = "cve.show"
title = "An advisory and our record of it"
params = { type = "object", required = ["advisory"], properties = { advisory = { type = "string" } } }
slash = "show"
summary = "An advisory, and every project's record of it: /cve show CVE-2026-1234"

[[commands]]
kind = "cve.impacts"
title = "Our recorded impacts"
params = { type = "object", properties = { project = { type = "string" }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"] } } }
slash = "impacts"
summary = "Every advisory recorded as touching a project: /cve impacts MB"

[[events]]
name = "cve.scanned"
description = "A scan's counts when it's done: new, reopened, gone and open, in all and for each project (its ref and commit)."

[[panes]]
id = "cve"
title = "CVE tracker"
format = "blocks"
opens = ["command", "menu"]
