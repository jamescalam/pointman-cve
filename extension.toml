# A CVE tracker: recent advisories, which ones hit the versions your projects' lockfiles pin (read from git at a
# ref, on command), and your own record of each one that touched a project, kept as this extension's files in the
# workspace.

[extension]
id = "cve"
name = "CVE tracker"
version = "0.14.0"
publisher = "jamescalam"
summary = "Recent advisories, the ones that hit your lockfiles, and a shared record of each that touched a project."
node = ">=0.2.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["python", "-m", "pointman_cve"]
runtime = "python3.12"

[behavior]
skill = "SKILL.md"               # how agents triage, fix, confirm and mark findings: in every wake on its nodes
files = ["references"]           # triage.md: each step's detail, and when not affected is right

[permissions]
network = true                   # GitHub's advisory database, OSV.dev, CISA's KEV feed and FIRST's EPSS
folders = ["~/Documents"]         # lockfiles only, for /cve scan and /cve check: where projects live

[settings]
type = "object"

[settings.properties.projects]
type = "array"
title = "Projects"
description = "What /cve scan reads: each a project's key (MB), its name, its git repo under ~/Documents, and the ref whose lockfiles count (origin/main if left out). Test data is skipped. A folder that isn't a git repo is read as files."
default = []
items = { type = "object", required = ["key", "repo"], additionalProperties = false, properties = { key = { type = "string", title = "Project", description = "A project's key: MB.", pattern = "^[A-Za-z][A-Za-z0-9]{0,15}$" }, name = { type = "string", title = "Name", description = "What people call it, in a scan's digest: Spark. Its key if left out.", maxLength = 60 }, repo = { type = "string", title = "Repo", description = "Its folder: ~/Documents/message-board." }, ref = { type = "string", title = "Ref", description = "A branch, tag or commit, fetched first.", default = "origin/main" }, skip = { type = "array", items = { type = "string" }, title = "Skip", description = "More paths that aren't the project's, beside tests, test, fixtures, testdata, examples and vendor folders: legacy/, docs/*.lock." }, include = { type = "array", items = { type = "string" }, title = "Include", description = "Paths to read anyway, even in those folders: examples/app." } } }

[settings.properties.ecosystem]
type = "string"
title = "Ecosystem"
description = "What /cve recent shows by default: all, rust, pip, go, npm, rubygems, maven, nuget, composer, swift or actions."
default = "all"

[[commands]]
kind = "cve.recent"
title = "Recent advisories"
params = { type = "object", properties = { ecosystem = { type = "string", description = "all, rust, pip, go, npm, …; left out, the setting." }, days = { type = "integer", minimum = 1, maximum = 90, description = "How far back; 7 if left out." } } }
slash = "recent"
summary = "Advisories published lately, newest first: /cve recent rust 14"

[[commands]]
kind = "cve.scan"
title = "Scan projects at their git refs for advisories"
lane = "records"                  # what writes records runs one at a time on a node
params = { type = "object", properties = { project = { type = "string", description = "A project's key in the projects setting; left out, every one." } } }
slash = "scan"
summary = "Scan the projects setting's repos at their refs: what's new, reopened, gone and open: /cve scan MB"

[[commands]]
kind = "cve.plan"
title = "Upgrade plan: which upgrades fix a project's advisories"
params = { type = "object", required = ["project"], properties = { project = { type = "string", description = "A project's key in the projects setting: MB." } } }
slash = "plan"
summary = "The fewest upgrades that fix the most: a line a package, from, to and how many it fixes: /cve plan MB"

[[commands]]
kind = "cve.check"
lane = "records"
title = "Check one folder's lockfiles against advisories"
params = { type = "object", properties = { folder = { type = "string", description = "The folder, read as it is on disk." }, project = { type = "string", description = "A project's key: opens an impact there for each advisory found." } } }
slash = "check"
summary = "Which advisories hit the versions a folder's lockfiles pin: /cve check ~/Documents/app MB"

[[commands]]
kind = "cve.add"
lane = "records"
title = "Record an advisory that touched a project"
params = { type = "object", required = ["advisory", "project"], properties = { advisory = { type = "string", description = "CVE-…, GHSA-…, or a short name for one without an id; several that one fix covers, comma-separated." }, project = { type = "string", description = "The project's key: MB." }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"], description = "fixed needs pr, commit or fixed_in; the next scan confirms it" }, fixed_in = { type = "string", description = "The release or version that fixed it." }, note = { type = "string", description = "Why: kept in its history; not_affected needs one." }, justification = { type = "string", enum = ["component_not_present", "vulnerable_code_not_present", "vulnerable_code_not_in_execute_path", "vulnerable_code_cannot_be_controlled_by_adversary", "inline_mitigations_already_exist"], description = "VEX's reason it's not_affected; with a note saying why." }, severity = { type = "string", enum = ["critical", "high", "medium", "low", "unknown"], description = "Ours, beside the published one." }, title = { type = "string" }, package = { type = "string", description = "Where it hit: the package." }, version = { type = "string" }, fixed_version = { type = "string" }, file = { type = "string", description = "The lockfile." }, repo = { type = "string", description = "owner/repo." }, pr = { type = "string", description = "PR or commit links, comma-separated." }, commit = { type = "string", description = "Commit links that fixed it, comma-separated." }, thread = { type = "string", description = "Pointman threads, comma-separated." }, task = { type = "string", description = "Task refs, comma-separated: MB-588." }, by = { type = "string", description = "Who's recording it: your handle (@you) or the person's. Kept in its history." } } }
slash = "add"
summary = "Record an advisory that touched a project: /cve add CVE-2026-1234 MB"

[[commands]]
kind = "cve.set"
lane = "records"
title = "Update a record (fixed needs a PR, commit or release)"
params = { type = "object", required = ["advisory", "project"], properties = { advisory = { type = "string", description = "One, or several comma-separated." }, project = { type = "string" }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"], description = "fixed needs pr, commit or fixed_in; the next scan confirms it" }, pr = { type = "string", description = "PR or commit links to add, comma-separated." }, commit = { type = "string", description = "Commit links that fixed it, comma-separated." }, thread = { type = "string", description = "Threads to add." }, task = { type = "string", description = "Task refs to add." }, fixed_in = { type = "string", description = "The release or version that fixed it." }, note = { type = "string", description = "Why: kept in its history; not_affected needs one." }, by = { type = "string", description = "Who's making the change: your handle (@you) or the person's. Kept in its history." }, justification = { type = "string", enum = ["component_not_present", "vulnerable_code_not_present", "vulnerable_code_not_in_execute_path", "vulnerable_code_cannot_be_controlled_by_adversary", "inline_mitigations_already_exist"] }, severity = { type = "string", enum = ["critical", "high", "medium", "low", "unknown"] }, title = { type = "string" }, package = { type = "string" }, version = { type = "string" }, fixed_version = { type = "string" }, file = { type = "string" }, repo = { type = "string" } } }
slash = "set"
summary = "Update an impact: /cve set CVE-2026-1234 MB fixed pr=https://github.com/…"

[[commands]]
kind = "cve.vex"
title = "OpenVEX export of a project's records"
params = { type = "object", required = ["project"], properties = { project = { type = "string", description = "A project's key: MB." }, author = { type = "string", description = "Who the document names as its author; pointman-cve if left out." } } }
outputs = ["document"]
slash = "vex"
summary = "A project's records as an OpenVEX document, posted as a file: /cve vex MB"

[[commands]]
kind = "cve.report"
title = "Fix report: open advisories and the PRs that fix them"
params = { type = "object", properties = { project = { type = "string", description = "Project keys, comma-separated: SPARK,MB. Left out, every project with open advisories." }, title = { type = "string", description = "The page's title; one that counts the PRs if left out." } } }
outputs = ["document"]
slash = "report"
summary = "Every open advisory a PR fixes, by project and PR, as a page to review and merge from: /cve report SPARK,MB"

[[commands]]
kind = "cve.show"
title = "An advisory and our record of it"
params = { type = "object", required = ["advisory"], properties = { advisory = { type = "string" } } }
slash = "show"
summary = "An advisory, and every project's record of it: /cve show CVE-2026-1234"

[[commands]]
kind = "cve.impacts"
title = "Our recorded impacts"
params = { type = "object", properties = { project = { type = "string" }, status = { type = "string", enum = ["investigating", "affected", "not_affected", "fixed"] } } }
slash = "impacts"
summary = "Every advisory recorded as touching a project: /cve impacts MB"

[[events]]
name = "cve.scanned"
description = "A scan's counts when it's done: new, reopened, gone and open, in all and for each project (its ref and commit)."

[[panes]]
id = "cve"
title = "CVE tracker"
format = "blocks"
opens = ["command", "menu"]
